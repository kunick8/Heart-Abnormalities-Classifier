[project]
name = "heart-abnormalities-classifier"
version = "0.1.0"
description = ""
authors = [
    {name = "Wiktor Witold Kunicki",email = "wkunicki47@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "tensorflow (==2.21.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "pandas (==2.3.3)",
    "numpy (>=2.5.2,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "optuna-integration (>=4.9.0,<5.0.0)",
    "mlflow (>=3.15.2,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
